<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Drive Pool: ein Tropfen fällt in den Pool. Quelle für icon-192/512 und apple-touch-icon. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17866e"/>
      <stop offset=".5" stop-color="#0b5245"/>
      <stop offset="1" stop-color="#042520"/>
    </linearGradient>
    <radialGradient id="light" cx=".2" cy=".08" r=".75">
      <stop offset="0" stop-color="#9af0d4" stop-opacity=".42"/>
      <stop offset=".65" stop-color="#9af0d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#02160f" stop-opacity=".6"/>
      <stop offset="1" stop-color="#02160f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#fdf3dc"/>
      <stop offset="1" stop-color="#f4d58c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fdf3dc" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#fdf3dc"/>
      <stop offset="1" stop-color="#fdf3dc" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#e9a93a"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3dc" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fdf3dc" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner"><ellipse cx="512" cy="712" rx="120" ry="40"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  <!-- Pool mit Wellenringen -->
  <ellipse cx="512" cy="712" rx="400" ry="150" fill="url(#pool)"/>
  <ellipse cx="512" cy="712" rx="344" ry="120" fill="none" stroke="url(#ring)" stroke-width="22" opacity=".45"/>
  <ellipse cx="512" cy="712" rx="240" ry="82" fill="none" stroke="url(#ring)" stroke-width="28" opacity=".8"/>
  <ellipse cx="512" cy="712" rx="136" ry="45" fill="none" stroke="url(#gold)" stroke-width="32"/>
  <!-- Spiegelung des Tropfens im Wasser -->
  <g clip-path="url(#inner)">
    <path d="M512 816 C512 816 456 740 456 712 A56 56 0 0 1 568 712 C568 740 512 816 512 816 Z" fill="url(#refl)" transform="translate(0 -30)"/>
  </g>
  <!-- Tropfen -->
  <path d="M512 150 C512 150 378 334 378 452 A134 134 0 0 0 646 452 C646 334 512 150 512 150 Z" fill="#02160f" opacity=".35" transform="translate(10 26)"/>
  <path d="M512 150 C512 150 378 334 378 452 A134 134 0 0 0 646 452 C646 334 512 150 512 150 Z" fill="url(#drop)"/>
  <path d="M512 150 C512 150 378 334 378 452 A134 134 0 0 0 646 452 C646 334 512 150 512 150 Z" fill="none" stroke="url(#gold)" stroke-width="10" opacity=".9"/>
  <path d="M446 432 C446 388 470 342 492 308" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" opacity=".9"/>
</svg>
